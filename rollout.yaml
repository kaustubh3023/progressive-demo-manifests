apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: progressive-demo
  namespace: progressive-demo

spec:

  replicas: 5

  selector:
    matchLabels:
      app: progressive-demo

  template:
    metadata:
      labels:
        app: progressive-demo

    spec:
      containers:

        - name: progressive-demo

          image: kaustubh3023/progressive-demo:v2

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000

            initialDelaySeconds: 5
            periodSeconds: 10

  strategy:

    canary:

      steps:

        - setWeight: 20

        - pause:
            duration: 30s
        - analysis:
            templates:
               - templateName: success-rate

        - setWeight: 40

        - pause:
            duration: 30s
        - analysis:
          templates:
            - templateName: success-rate

        - setWeight: 60

        - pause:
            duration: 30s

        - setWeight: 80

        - pause:
            duration: 30s
